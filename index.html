<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            text-align: center;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            display: flex;
            margin: 10px 0;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 60%;
            animation: fadeIn 0.3s ease;
        }

        .user {
            justify-content: flex-end;
        }

        .user .bubble {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .bot {
            justify-content: flex-start;
        }

        .bot .bubble {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
        }

        .typing {
            opacity: 0.6;
            font-style: italic;
        }

        .input-box {
            display: flex;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        button {
            margin-left: 8px;
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .send-btn {
            background: #22c55e;
        }

        .mic-btn {
            background: #ec4899;
        }

        button:hover {
            opacity: 0.85;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(5px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="header">🤖 AI Chatbot</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-box">
    <input id="userInput" placeholder="Type or speak..." />
    <button class="mic-btn" onclick="startVoice()">🎤</button>
    <button class="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
const input = document.getElementById("userInput");

input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
});

async function sendMessage() {
    let message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    let typing = addMessage("Typing...", "bot", true);

    let res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message: message })
    });

    let data = await res.json();
    typing.remove();

    typeEffect(data.response);
}

function addMessage(text, sender, typing=false) {
    let chatBox = document.getElementById("chatBox");

    let msg = document.createElement("div");
    msg.classList.add("message", sender);

    let bubble = document.createElement("div");
    bubble.classList.add("bubble");

    if (typing) bubble.classList.add("typing");

    bubble.innerText = text;

    msg.appendChild(bubble);
    chatBox.appendChild(msg);

    chatBox.scrollTop = chatBox.scrollHeight;

    return msg;
}

function typeEffect(text) {
    let chatBox = document.getElementById("chatBox");

    let msg = document.createElement("div");
    msg.classList.add("message", "bot");

    let bubble = document.createElement("div");
    bubble.classList.add("bubble");

    msg.appendChild(bubble);
    chatBox.appendChild(msg);

    let i = 0;
    function typing() {
        if (i < text.length) {
            bubble.innerText += text[i++];
            setTimeout(typing, 15);
        }
    }
    typing();
}

// 🎤 Voice input
function startVoice() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US";

    recognition.onresult = function(event) {
        let transcript = event.results[0][0].transcript;
        input.value = transcript;
        sendMessage();
    };

    recognition.start();
}
</script>

</body>
</html>
