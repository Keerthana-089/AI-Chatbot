<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #1e3a8a, #020617);
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            text-align: center;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 20px;
            max-width: 65%;
            font-size: 15px;
        }

        .user .bubble {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            box-shadow: 0 0 15px rgba(59,130,246,0.5);
        }

        .bot .bubble {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .input-box {
            display: flex;
            padding: 12px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
        }

        input {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.15);
            color: white;
        }

        .send-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }

        .mic-btn {
            background: linear-gradient(135deg, #ec4899, #db2777);
        }
    </style>
</head>

<body>

<div class="header">🤖 AI Chatbot</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-box">
    <input id="userInput" placeholder="Type or speak..." />
    <button class="mic-btn" onclick="startVoice()">🎤</button>
    <button class="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
const input = document.getElementById("userInput");

input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
});

async function sendMessage() {
    let message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    let typing = addMessage("Typing...", "bot", true);

    let res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message: message })
    });

    let data = await res.json();
    typing.remove();

    typeEffect(data.response);
}

function addMessage(text, sender, typing=false) {
    let chatBox = document.getElementById("chatBox");

    let msg = document.createElement("div");
    msg.classList.add("message", sender);

    let bubble = document.createElement("div");
    bubble.classList.add("bubble");

    if (typing) bubble.classList.add("typing");

    bubble.innerText = text;

    msg.appendChild(bubble);
    chatBox.appendChild(msg);

    chatBox.scrollTop = chatBox.scrollHeight;

    return msg;
}

function typeEffect(text) {
    let chatBox = document.getElementById("chatBox");

    let msg = document.createElement("div");
    msg.classList.add("message", "bot");

    let bubble = document.createElement("div");
    bubble.classList.add("bubble");

    msg.appendChild(bubble);
    chatBox.appendChild(msg);

    let i = 0;
    function typing() {
        if (i < text.length) {
            bubble.innerText += text[i++];
            setTimeout(typing, 15);
        }
    }
    typing();
}

// 🎤 Voice input
function startVoice() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US";

    recognition.onresult = function(event) {
        let transcript = event.results[0][0].transcript;
        input.value = transcript;
        sendMessage();
    };

    recognition.start();
}
</script>

</body>
</html>
