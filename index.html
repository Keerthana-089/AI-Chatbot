<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: white;
        }

        .header {
            padding: 15px;
            text-align: center;
            font-size: 20px;
            background: #1e293b;
            font-weight: bold;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            margin: 10px 0;
            display: flex;
        }

        .bubble {
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 60%;
            animation: fadeIn 0.3s ease-in;
        }

        .user {
            justify-content: flex-end;
        }

        .user .bubble {
            background: #3b82f6;
        }

        .bot {
            justify-content: flex-start;
        }

        .bot .bubble {
            background: #334155;
        }

        .typing {
            font-style: italic;
            opacity: 0.7;
        }

        .input-box {
            display: flex;
            padding: 10px;
            background: #1e293b;
        }

        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            margin-left: 10px;
            padding: 12px 18px;
            background: #22c55e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #16a34a;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(5px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="header">🤖 AI Chatbot</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-box">
    <input id="userInput" placeholder="Type or speak..." />
    <button onclick="startVoice()">🎤</button>
    <button onclick="sendMessage()">Send</button>
</div>

<script>
const input = document.getElementById("userInput");

input.addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        sendMessage();
    }
});

async function sendMessage() {
    let message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    // typing indicator
    let typing = addMessage("Bot is typing...", "bot", true);

    let response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message })
    });

    let data = await response.json();

    typing.remove(); // remove typing indicator

    typeEffect(data.response);
}

function addMessage(text, sender, isTyping=false) {
    let chatBox = document.getElementById("chatBox");

    let msg = document.createElement("div");
    msg.classList.add("message", sender);

    let bubble = document.createElement("div");
    bubble.classList.add("bubble");

    if (isTyping) bubble.classList.add("typing");

    bubble.innerText = text;

    msg.appendChild(bubble);
    chatBox.appendChild(msg);

    chatBox.scrollTop = chatBox.scrollHeight;

    return msg;
}

function typeEffect(text) {
    let chatBox = document.getElementById("chatBox");

    let msg = document.createElement("div");
    msg.classList.add("message", "bot");

    let bubble = document.createElement("div");
    bubble.classList.add("bubble");

    msg.appendChild(bubble);
    chatBox.appendChild(msg);

    let i = 0;

    function typing() {
        if (i < text.length) {
            bubble.innerText += text.charAt(i);
            i++;
            setTimeout(typing, 20);
        }
    }

    typing();
    chatBox.scrollTop = chatBox.scrollHeight;
}

function startVoice() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

    recognition.lang = "en-US";

    recognition.onstart = () => {
        console.log("Voice recognition started...");
    };

    recognition.onresult = function(event) {
        let transcript = event.results[0][0].transcript;
        document.getElementById("userInput").value = transcript;
        sendMessage();
    };

    recognition.onerror = function(event) {
        alert("Voice error: " + event.error);
    };

    recognition.start();
}
</script>

</body>
</html>
